<section class="page-title"><div class="eyebrow">SIGNALTECHNIK</div><h1>Analogsignal-Rechner</h1></section><section class="panel"><div class="grid2"><label><span>Prozesswert min.</span><input id="p0" type="number" value="0"/></label><label><span>Prozesswert max.</span><input id="p1" type="number" value="100"/></label><label><span>Signal min. (mA)</span><input id="s0" type="number" value="4"/></label><label><span>Signal max. (mA)</span><input id="s1" type="number" value="20"/></label><label><span>Richtung</span><select id="dir"><option value="ps">Prozesswert → Signal</option><option value="sp">Signal → Prozesswert</option></select></label><label><span>Eingabewert</span><input id="x" type="number" value="50"/></label></div><div class="result"><div class="muted">Ergebnis</div><strong id="out">–</strong><div id="pct"></div></div></section></main><!-- sk:footer:start --><footer class="footer sk-footer">SK PLT Tools · Entwickelt von Simon Kiesler</footer><!-- sk:footer:end --></div><script src="../assets/app.js?v=2.1.5.0-Beta"></script><script>function calc(){let a=num(p0.value),b=num(p1.value),c=num(s0.value),d=num(s1.value),v=num(x.value),q;if([a,b,c,d,v].some(Number.isNaN)||a===b||c===d){out.textContent='Ungültige Eingabe';return}if(dir.value==='ps'){q=c+(v-a)/(b-a)*(d-c);out.textContent=de(q)+' mA';pct.textContent=de((v-a)/(b-a)*100,1)+' %'}else{q=a+(v-c)/(d-c)*(b-a);out.textContent=de(q)+' Prozesswert';pct.textContent=de((v-c)/(d-c)*100,1)+' %'}}document.querySelectorAll('input,select').forEach(e=>e.oninput=calc);calc()</script><!-- sk:controls:start --><button aria-label="Favoriten öffnen" class="sk-favorites-trigger" type="button"><span class="sk-trigger-star"><svg aria-hidden="true" class="sk-star-svg" viewBox="0 0 24 24"><path class="sk-star-fill" d="M12 2.75l2.82 5.72 6.31.92-4.57 4.45 1.08 6.29L12 17.16l-5.64 2.97 1.08-6.29-4.57-4.45 6.31-.92L12 2.75z"></path></svg></span><span class="sk-favorites-count" hidden>0</span></button><button aria-label="Seitennavigat
