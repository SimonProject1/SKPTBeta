-anchor="middle">5</text><rect x="934" y="236" width="192" height="154" rx="22" fill="#09283b" stroke="#89d329" stroke-width="3"/><text x="1030" y="296" class="h" text-anchor="middle">SIL</text><text x="1030" y="337" class="s" text-anchor="middle">verriegeln</text><rect x="110" y="455" width="980" height="116" rx="20" fill="#2a1822" stroke="#573e4a" stroke-width="2"/><circle cx="166" cy="513" r="30" fill="#ff6b76"/><text x="166" y="524" class="h" text-anchor="middle" fill="#061827">!</text><text x="218" y="499" class="h">STOPP bei unbestätigtem Gerätestand oder unklarer PIN</text><text x="218" y="536" class="s">Herstellerdokumentation, Sicherheitskonzept und betriebliche Freigabe sind maßgeblich.</text></svg>
