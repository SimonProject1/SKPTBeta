<text x="54" y="53" class="sub">TECHNISCHE ÜBERSICHT</text><text x="54" y="101" class="title">SPS-Rohwert: vom Signal zum Prozesswert</text><circle cx="150" cy="190" r="19" fill="#89d329"/><text x="150" y="197" class="num" text-anchor="middle">1</text><rect x="54" y="240" width="192" height="190" rx="22" fill="#09283b" stroke="#00b7e8" stroke-width="3"/><text x="150" y="310" class="h" text-anchor="middle">Sensor</text><text x="150" y="354" class="s" text-anchor="middle">4 … 20 mA</text><path d="M248 335H271" stroke="#89d329" stroke-width="8" marker-end="url(#arrowG)"/><circle cx="370" cy="190" r="19" fill="#89d329"/><text x="370" y="197" class="num" text-anchor="middle">2</text><rect x="274" y="240" width="192" height="190" rx="22" fill="#09283b" stroke="#2a5369" stroke-width="3"/><text x="370" y="310" class="h" text-anchor="middle">A/D-Wandler</text><text x="370" y="354" class="s" text-anchor="middle">digitalisiert</text><path d="M468 335H491" stroke="#89d329" stroke-width="8" marker-end="url(#arrowG)"/><circle cx="590" cy="190" r="19" fill="#89d329"/><text x="590" y="197" class="num" text-anchor="middle">3</text><rect x="494" y="240" width="192" height="190" rx="22" fill="#09283b" stroke="#00b7e8" stroke-width="3"/><text x="590" y="310" class="h" text-anchor="middle">Rohwert</text><text x="590" y="354" class="s" text-anchor="middle">0 … 27.648</text><path d="M688 335H711" stroke="#89d329" stroke-width="8" marker-end="url(#arrowG)"/><circle cx="810" cy="190" r="19" fill="#89d329"/><text x="810" y="197" class="num" text-anchor="middle">4</text><rect x="714" y="240" width="192" height="190" rx="22" fill="#09283b" stroke="#2a5369" stroke-width="3"/><text x="810" y="310" class="h" text-anchor="middle">Skalierung</text><text x="810" y="354" class="s" text-anchor="middle">linear</text><path d="M908 335H931" stroke="#89d329" stroke-width="8" marker-end="url(#arrowG)"/><circle cx="1030" cy="190" r="19" fill="#89d329"/><text x="1030" y="197" class="num" text-anchor="middle">5</text><rect x="934" y="240" width="192" height="190" rx="22" fill="#09283b" stroke="#00b7e8" stroke-width="3"/><text x="1030" y="310" class="h" text-anchor="middle">Prozesswert</text><text x="1030" y="354" class="s" text-anchor="middle">z. B. 0 … 10 bar</text><rect x="92" y="482" width="1016" height="88" rx="18" fill="#0b3046" stroke="#2a5369"/><text x="600" y="520" class="h" text-anchor="middle">Rohwert = interne Zahlendarstellung der Analogkarte</text><text x="600" y="552" class="s" text-anchor="middle">Der physikalische Wert entsteht erst durch die zur Parametrierung passende Skalierung.</text></svg>
