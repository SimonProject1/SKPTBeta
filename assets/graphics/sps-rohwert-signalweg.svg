<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">SPS-Rohwert: vom Signal zum Prozesswert</title><desc id="desc">Signalweg vom 4-bis-20-mA-Sensor über A/D-Wandler und Siemens-Rohwert zur Skalierung in einen physikalischen Prozesswert.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a293d"/><stop offset="1" stop-color="#041522"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".24"/></filter>
 <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00b7e8"/></marker>
 <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#89d329"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f7fbff;font-weight:800;font-size:38px}.sub{fill:#89d329;font-weight:800;font-size:15px;letter-spacing:2px}.h{fill:#f7fbff;font-weight:800;font-size:25px}.b{fill:#c8dbe4;font-size:19px}.s{fill:#9fb8c5;font-size:16px}.code{fill:#89d329;font-weight:900;font-size:32px}.num{fill:#061827;font-weight:900;font-size:19px}</style>
