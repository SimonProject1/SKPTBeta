<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">SPS-Rohwert: zwei Parametriermodelle</title><desc id="desc">Vergleich der Siemens-Nennskalierung bei Kanalparametrierung 4-bis-20-mA und 0-bis-20-mA.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a293d"/><stop offset="1" stop-color="#041522"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".24"/></filter>
 <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00b7e8"/></marker>
 <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#89d329"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f7fbff;font-weight:800;font-size:38px}.sub{fill:#89d329;font-weight:800;font-size:15px;letter-spacing:2px}.h{fill:#f7fbff;font-weight:800;font-size:25px}.b{fill:#c8dbe4;font-size:19px}.s{fill:#9fb8c5;font-size:16px}.code{fill:#89d329;font-weight:900;font-size:32px}.num{fill:#061827;font-weight:900;font-size:19px}</style>
</defs><rect width="1200" height="680" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="678" rx="29" fill="none" stroke="#2a5369" stroke-width="2"/>
<text x="54" y="53" class="sub">TECHNISCHE ÜBERSICHT</text><text x="54" y="101" class="title">SPS-Rohwert: zwei Parametriermodelle</text><rect x="54" y="150" width="1092" height="448" rx="22" fill="#09283b" stroke="#2a5369" stroke-width="2" filter="url(#shadow)"/><text x="82" y="238" class="h">Kanal 4 … 20 mA</text><line x1="270" y1="278" x2="1080" y2="278" stroke="#9fb8c5" stroke-width="12" stroke-linecap="round"/><circle cx="270" cy="278" r="15" fill="#89d329"/><text x="270" y="324" class="s" text-anchor="middle">4 mA</text><text x="270" y="353" class="b" text-anchor="middle">0</text><circle cx="675" cy="278" r="15" fill="#89d329"/><text x="675" y="324" class="s" text-anchor="middle">12 mA</text><text x="675" y="353" class="b" text-anchor="middle">13.824</text><circle cx="1080" cy="278" r="15" fill="#89d329"/><text x="1080" y="324" class="s" text-anchor="middle">20 mA</text><text x="1080" y="353" class="b" text-anchor="middle">27.648</text><text x="82" y="405" class="h">Kanal 0 … 20 mA</text><line x1="270" y1="445" x2="1080" y2="445" stroke="#9fb8c5" stroke-width="12" stroke-linecap="round"/><circle cx="270" cy="445" r="15" fill="#89d329"/><text x="270" y="491" class="s" text-anchor="middle">0 mA</text><text x="270" y="520" class="b" text-anchor="middle">0</text><circle cx="432" cy="445" r="15" fill="#ffc267"/><text x="432" y="491" class="s" text-anchor="middle">4 mA</text><text x="432" y="520" class="b" text-anchor="middle">≈ 5.530</text><circle cx="675" cy="445" r="15" fill="#89d329"/><text x="675" y="491" class="s" text-anchor="middle">10 mA</text><text x="675" y="520" class="b" text-anchor="middle">13.824</text><circle cx="1080" cy="445" r="15" fill="#89d329"/><text x="1080" y="491" class="s" text-anchor="middle">20 mA</text><text x="1080" y="520" class="b" text-anchor="middle">27.648</text><text x="600" y="566" class="b" text-anchor="middle">Nicht vermischen: Der gleiche Strom kann je nach Kanalparametrierung einen anderen Rohwert besitzen.</text></svg>
