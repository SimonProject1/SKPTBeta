<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Vacon: Abweichung systematisch eingrenzen</title><desc id="desc">Vierstufige Prüfkette aus Symptom bestätigen, Parameter öffnen, Grenzwert abgleichen und Änderung absichern.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a293d"/><stop offset="1" stop-color="#041522"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".24"/></filter>
 <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00b7e8"/></marker>
 <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#89d329"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f7fbff;font-weight:800;font-size:38px}.sub{fill:#89d329;font-weight:800;font-size:15px;letter-spacing:2px}.h{fill:#f7fbff;font-weight:800;font-size:25px}.b{fill:#c8dbe4;font-size:19px}.s{fill:#9fb8c5;font-size:16px}.code{fill:#89d329;font-weight:900;font-size:32px}.num{fill:#061827;font-weight:900;font-size:19px}</style>
</defs><rect width="1200" height="680" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="678" rx="29" fill="none" stroke="#2a5369" stroke-width="2"/>
<text x="54" y="53" class="sub">TECHNISCHE ÜBERSICHT</text><text x="54" y="101" class="title">Vacon: Abweichung systematisch eingrenzen</text><circle cx="179" cy="194" r="19" fill="#89d329"/><text x="179" y="201" class="num" text-anchor="middle">1</text><rect x="54" y="245" width="250" height="230" rx="24" fill="#09283b" stroke="#00b7e8" stroke-width="3"/><text x="179" y="318" class="h" text-anchor="middle">Symptom bestätigen</text><text x="179" y="366" class="s" text-anchor="middle">Ist / Soll vergleichen</text><path d="M306 360H329" stroke="#00b7e8" stroke-width="7" marker-end="url(#arrowC)"/><circle cx="457" cy="194" r="19" fill="#89d329"/><text x="457" y="201" class="num" text-anchor="middle">2</text><rect x="332" y="245" width="250" height="230" rx="24" fill="#09283b" stroke="#00b7e8" stroke-width="3"/><text x="457" y="318" class="h" text-anchor="middle">Parameter öffnen</text><text x="457" y="366" class="s" text-anchor="middle">2.2.3.7</text><path d="M584 360H607" stroke="#00b7e8" stroke-width="7" marker-end="url(#arrowC)"/><circle cx="735" cy="194" r="19" fill="#89d329"/><text x="735" y="201" class="num" text-anchor="middle">3</text><rect x="610" y="245" width="250" height="230" rx="24" fill="#09283b" stroke="#00b7e8" stroke-width="3"/><text x="735" y="318" class="h" text-anchor="middle">Grenzwert abgleichen</text><text x="735" y="366" class="s" text-anchor="middle">max. Frequenz</text><path d="M862 360H885" stroke="#00b7e8" stroke-width="7" marker-end="url(#arrowC)"/><circle cx="1013" cy="194" r="19" fill="#89d329"/><text x="1013" y="201" class="num" text-anchor="middle">4</text><rect x="888" y="245" width="250" height="230" rx="24" fill="#09283b" stroke="#89d329" stroke-width="3"/><text x="1013" y="318" class="h" text-anchor="middle">Änderung absichern</text><text x="1013" y="366" class="s" text-anchor="middle">Motor · Anlage · Freigabe</text><rect x="158" y="516" width="884" height="74" rx="18" fill="#2a2116" stroke="#ffc267" stroke-width="2"/><text x="600" y="562" class="b" text-anchor="middle">Parameter nur innerhalb der gültigen Motor-, Anlagen- und Inbetriebnahmevorgaben ändern.</text></svg>
