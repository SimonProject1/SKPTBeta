<section class="page-title"><div class="eyebrow">UMRECHNUNG</div><h1>Einheitenrechner</h1></section><section class="panel"><div class="grid3"><label><span>Kategorie</span><select id="cat"><option>Druck</option><option>Temperatur</option><option>Länge</option><option>Strom</option><option>Spannung</option></select></label><label><span>Von</span><select id="from"></select></label><label><span>Nach</span><select id="to"></select></label><label><span>Wert</span><input id="x" type="number" value="1"/></label></div><div class="result"><strong id="out">–</strong></div></section></main><!-- sk:footer:start --><footer class="footer sk-footer">SK PLT Tools · Entwickelt von Simon Kiesler</footer><!-- sk:footer:end --></div><script src="../assets/app.js?v=2.1.4.1-Beta"></script><script>const U={Druck:{bar:1,mbar:.001,Pa:.00001,kPa:.01,MPa:10},Temperatur:{'°C':'c',K:'k'},Länge:{mm:.001,cm:.01,m:1,km:1000},Strom:{'µA':.000001,mA:.001,A:1},Spannung:{mV:.001,V:1}};function set(){let o=Object.keys(U[cat.value]);from.innerHTML=to.innerHTML=o.map(x=>'<option>'+x+'</option>').join('');to.selectedIndex=Math.min(1,o.length-1);calc()}function calc(){let v=num(x.value),a=from.value,b=to.value;if(cat.value==='Temperatur'){let c=a==='K'?v-273.15:v;out.textContent=de(b==='K'?c+273.15:c,3)+' '+b}else out.textContent=de(v*U[cat.value][a]/U[cat.value][b],3)+' '+b}cat.onchange=set;document.querySelectorAll('#from,#to,#x').forEach(e=>e.oninput=calc);set()</script><!-- sk:controls:start --><button aria-label="Favoriten öffnen" class="sk-favorites-trigger" type="button"><span class="sk-trigger-star"><svg aria-hidden="true" class="sk-star-svg" viewBox="0 0 24 24"><path class="sk-star-fill" d="M12 2.75l2.82 5.72 6.31.92-4.57 4.45 1.08 6.29L12 17.16l-5.64 2.97 1.08-6.29-4.57-4.45 6.31-.92L12 2.75z"></path></svg></span><span class="sk-favorites-count" hidden>0</span></button><button aria-label="Seitennavigation öffnen" class="sk-tree-trigger" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><pa
