<section class="page-title"><div class="eyebrow">DOKUMENTATION</div><h1>Messstellen-Dokumentation</h1></section><section class="panel"><div class="grid2"><label><span>Messstelle</span><input id="tag"/></label><label><span>Bearbeiter</span><input id="person" value="Simon Kiesler"/></label><label><span>Datum</span><input id="date" type="date"/></label><label><span>Bemerkung</span><textarea id="note"></textarea></label></div><h2>Typenschild</h2><div class="checkrow"><input id="tnone" type="checkbox"/><label for="tnone">Foto wird nicht benötigt</label></div><input accept="image/*" id="tphoto" multiple="" type="file"/><div id="tlist"></div><h2>Einbausituation</h2><div class="checkrow"><input id="enone" type="checkbox"/><label for="enone">Foto wird nicht benötigt</label></div><input accept="image/*" id="ephoto" multiple="" type="file"/><div id="elist"></div><div class="toolbar"><button onclick="window.print()">Als PDF drucken</button><button onclick="resetDoc()">Neue Messstelle</button></div><p class="muted">Beim Drucken werden Kategorien ohne benötigtes Foto nicht als Fotoseiten ausgegeben.</p></section></main><!-- sk:footer:start --><footer class="footer sk-footer">SK PLT Tools · Entwickelt von Simon Kiesler</footer><!-- sk:footer:end --></div><script src="../assets/app.js?v=2.2.0.2-Beta"></script><script>date.valueAsDate=new Date();const S={t:[],e:[]};function load(k,files){for(const f of files){const r=new FileReader;r.onload=()=>{S[k].push({src:r.result,note:''});draw(k)};r.readAsDataURL(f)}}function draw(k){$(k+'list').innerHTML=S[k].map((p,i)=>`<div class="photo"><img src="${p.src}"><input placeholder="Bildbeschriftung" value="${p.note}" oninput="S.${k}[${i}].note=this.value"><button onclick="S.${k}.splice(${i},1);draw('${k}')">Löschen</button></div>`).join('')}tphoto.onchange=e=>load('t',e.target.files);ephoto.onchange=e=>load('e',e.target.files);tnone.onchange=()=>{tphoto.disabled=tnone.checked;tlist.classList.toggle('hidden',tnone.checked)};enone.onchange=()=>{ephoto.disabled=enone.checked;elist.classList.toggle('hidden',enone.checked)};function resetDoc(){tag.value=note.value='';S.t=[];S.e=[];tnone.checked=enone.checked=false;draw('t');draw('e')} </script><style>@media print{.topbar,.footer,.support,.toolbar,input[type=file],.checkrow{display:none!important}.shell{width:100%;max-width:none}.photo{break-before:page;border:0}.photo img{max-height:75vh}body{background:#fff;color:#000}.panel{border:0;background:#fff}.hidden{display:none!important}}</style><!-- sk:controls:start --><button aria-label="Favoriten öffnen" class="sk-favorites-trigger" type="button"><span class="sk-trigger-star"><svg aria-hidden="true" class="sk-star-svg" viewBox="0 0 24 24"><path class="sk-star-fill" d="M12 2.75l2.82 5.72 6.31.92-4.57 4.45 1.08 6.29L12 17.16l-5.64 2.97 1.08-6.29-4.57-4.45 6.31-.92L12 2.75z"></path></svg></span><span class="sk-favorites-count" hidden>0</span></button><button aria-label="Seitennavigation öffnen" class="sk-tree-trigger" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v4H4V4zm0 12h4v4H4v-4zm12-6h4v4h-4v-4zM8 6h5v6h3v2h-5V8H8V6zm0 12h5v-5h3v-2h-5v5H8v2z"></path></svg></button><!-- sk:controls:end --></body></html>
