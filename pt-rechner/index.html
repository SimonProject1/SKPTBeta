<section class="page-title"><div class="eyebrow">TEMPERATURSENSOREN</div><h1>Pt100 / Pt1000</h1></section><section class="panel"><div class="grid3"><label><span>Sensor</span><select id="sensor"><option value="100">Pt100</option><option value="1000">Pt1000</option></select></label><label><span>Richtung</span><select id="dir"><option value="tr">°C → Ω</option><option value="rt">Ω → °C</option></select></label><label><span>Eingabe</span><input id="x" type="number" value="0"/></label></div><div class="result"><strong id="out">–</strong><p class="muted">Näherungsberechnung nach IEC-60751 im üblichen Bereich.</p></div></section></main><!-- sk:footer:start --><footer class="footer sk-footer">SK PLT Tools · Entwickelt von Simon Kiesler</footer><!-- sk:footer:end --></div><script src="../assets/app.js?v=2.1.2.0-Beta"></script><script>function r(t,r0){const A=3.9083e-3,B=-5.775e-7,C=-4.183e-12;return t>=0?r0*(1+A*t+B*t*t):r0*(1+A*t+B*t*t+C*(t-100)*t*t*t)}function calc(){let v=num(x.value),r0=num(sensor.value);if(!Number.isFinite(v))return;if(dir.value==='tr')out.textContent=de(r(v,r0),3)+' Ω';else{let lo=-200,hi=850;for(let i=0;i<50;i++){let m=(lo+hi)/2;r(m,r0)<v?lo=m:hi=m}out.textContent=de((lo+hi)/2,2)+' °C'}}document.querySelectorAll('input,select').forEach(e=>e.oninput=calc);calc()</script><!-- sk:controls:start --><button aria-label="Favoriten öffnen" class="sk-favorites-trigger" type="button"><span class="sk-trigger-star"><svg aria-hidden="true" class="sk-star-svg" viewBox="0 0 24 24"><path class="sk-star-fill" d="M12 2.75l2.82 5.72 6.31.92-4.57 4.45 1.08 6.29L12 17.16l-5.64 2.97 1.08-6.29-4.57-4.45 6.31-.92L12 2.75z"></path></svg></span><span class="sk-favorites-count" hidden>0</span></button><button aria-label="Seitennavigation öffnen" class="sk-tree-trigger" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v4H4V4zm0 12h4v4H4v-4zm12-6h4v4h-4v-4zM8 6h5v6h3v2h-5V8H8V6zm0 12h5v-5h3v-2h-5v5H8v2z"></path></svg></button><!-- sk:controls:end --></body
